<div class="content">

  <div class="card-dark">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="form-title">Authors</h2>

      <!-- ADD BUTTON -->
      <button class="btn-blue" (click)="goToCreate()">
        + Add Author
      </button>
    </div>

    <div class="table-responsive">

      <table class="table table-hover">

        <thead>
          <tr>
            <th>#</th>
            <th>Full Name</th>
            <th>Birth Date</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>

          @if (authors.length > 0) {

            @for (author of authors; track author.id; let i = $index) {
              <tr>
                <td>{{ i + 1 }}</td>

                <td>{{ author.fullName }}</td>

                <td>
                  {{ author.birthDate ? (author.birthDate | date:'mediumDate') : '-' }}
                </td>

                <td class="action-buttons">

                  <!--  EDIT -->
                  <button class="btn-icon edit"
                          (click)="goToEdit(author.id)">
                     <i class="bi bi-pencil"></i>
                  </button>

                  <!-- 🗑 DELETE -->
                  <button class="btn-icon delete"
                          (click)="deleteAuthor(author.id)">
                    <i class="bi bi-trash"></i>
                  </button>

                </td>
              </tr>
            }

          } @else {

            <tr>
              <td colspan="4" class="text-center text-muted">
                No authors found
              </td>
            </tr>

          }

        </tbody>

      </table>

    </div>

  </div>

</div>
