<div class="container">

  <div class="container">
  <h2>{{ mode === 'edit' ? 'Edit Book' : 'Add Book' }}</h2>

  <form #bookForm="ngForm" (ngSubmit)="addBook(bookForm)">

    <div class="card shadow p-4">

      <h3 class="text-center mb-4">
        {{ mode === 'edit' ? 'Edit Book' : 'Add Book' }}
      </h3>

      <!-- Title -->
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" class="form-control"
          name="title"
          [(ngModel)]="book.title"
          required>
      </div>

      <!-- Subtitle -->
      <div class="mb-3">
        <label class="form-label">Subtitle</label>
        <input type="text" class="form-control"
          name="subtitle"
          [(ngModel)]="book.subtitle">
      </div>

      <!-- ISBN -->
      <div class="mb-3">
        <label class="form-label">ISBN</label>
        <input type="text" class="form-control"
          name="isbn"
          [(ngModel)]="book.isbn">
      </div>

      <!-- Edition -->
      <div class="mb-3">
        <label class="form-label">Edition</label>
        <input type="text" class="form-control"
          name="edition"
          [(ngModel)]="book.edition">
      </div>

      <!-- Published Year -->
      <div class="mb-3">
        <label class="form-label">Published Year</label>
        <input type="number" class="form-control"
          name="publishedYear"
          [(ngModel)]="book.publishedYear">
      </div>

      <!-- Language -->
      <div class="mb-3">
        <label class="form-label">Language</label>
        <input type="text" class="form-control"
          name="language"
          [(ngModel)]="book.language">
      </div>

      <!-- Summary -->
      <div class="mb-3">
        <label class="form-label">Summary</label>
        <textarea class="form-control"
          name="summary"
          [(ngModel)]="book.summary"></textarea>
      </div>

      <!-- SubCategory -->
      <div class="mb-3">
        <label class="form-label">SubCategory</label>
        <select class="form-select"
          name="subCategoryId"
          [(ngModel)]="book.subCategoryId"
          required>

          <option value="">-- Select SubCategory --</option>

          @for (sub of subCategories; track sub.id) {
            <option [value]="sub.id">
              {{ sub.name }}
            </option>
          }
        </select>
      </div>

      <!-- Authors -->
      <div class="mb-3">
        <label class="form-label">Authors</label>
        <select class="form-select"
          name="authorIds"
          [(ngModel)]="book.authorIds"
          multiple>

          @for (author of authors; track author.id) {
            <option [value]="author.id">
              {{ author.fullName }}
            </option>
          }
        </select>
      </div>

      <!-- Categories -->
      <div class="mb-3">
        <label class="form-label">Categories</label>
        <select class="form-select"
          name="categoryIds"
          [(ngModel)]="book.categoryIds"
          multiple>

          @for (cat of categories; track cat.id) {
            <option [value]="cat.id">
              {{ cat.name }}
            </option>
          }
        </select>
      </div>

      <!-- ✅ CURRENT IMAGE (EDIT MODE ONLY) -->
      @if (mode === 'edit' && book.coverImageUrl) {
        <div class="mb-3">
          <label class="form-label">Current Image</label><br>
          <img [src]="book.coverImageUrl"
               width="100"
               style="border-radius: 6px;">
        </div>
      }

      <!-- Image Upload -->
      <div class="mb-3">
        <label class="form-label">
          {{ mode === 'edit' ? 'Change Image (optional)' : 'Cover Image' }}
        </label>

        <input type="file" class="form-control"
          (change)="onFileSelected($event)">
      </div>

      <!-- Submit -->
      <button class="btn btn-primary w-100" [disabled]="isLoading">
        {{ isLoading
            ? 'Saving...'
            : (mode === 'edit' ? 'Update Book' : 'Add Book') }}
      </button>

    </div>

  </form>
</div>
</div>
