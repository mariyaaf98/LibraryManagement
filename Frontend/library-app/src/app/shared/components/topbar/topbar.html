<div class="topbar d-flex justify-content-between align-items-center p-3">
  <h5>Welcome {{ userName }}</h5>

  <div class="d-flex align-items-center gap-2">

    @if (isLoggedIn) {
      <button (click)="logout()" class="btn btn-sm btn-danger">
        Logout
      </button>
    } @else {
      <button (click)="goToLogin()" class="btn btn-sm btn-primary">
        Login
      </button>
    }

  </div>
</div>
