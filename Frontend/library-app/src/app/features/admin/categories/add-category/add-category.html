<div class="card-dark form-container">

  <h3 class="form-title">
    {{ isEditMode ? 'Edit Category' : 'Add Category' }}
  </h3>

  <!-- CATEGORY -->
  <div class="form-grid">

    <div class="form-group">
      <label>Category Name</label>
      <input 
        name="categoryName"
        [(ngModel)]="category.name"
        placeholder="Enter category name"
        required
      >
    </div>

    <div class="form-group full">
      <label>Description</label>
      <input 
        name="categoryDescription"
        [(ngModel)]="category.description"
        placeholder="Enter description"
      >
    </div>

  </div>

  <!-- SUBCATEGORY -->
  <div class="mt-4">

    <h5>Sub Categories</h5>

    @for (sub of category.subCategories; track sub.id || i; let i = $index){

      <div class="d-flex gap-2 mb-2">

        <!-- hidden id -->
        <input type="hidden" [(ngModel)]="sub.id">

        <!-- Name -->
        <input 
          name="subName-{{i}}"
          [(ngModel)]="sub.name"
          placeholder="SubCategory name"
          required
        >

        <!-- Description -->
        <input 
          name="subDesc-{{i}}"
          [(ngModel)]="sub.description"
          placeholder="Description"
        >

        <!-- Remove -->
        <button 
          type="button"
          class="btn-icon delete"
          (click)="removeSubCategory(i)"
        >
          <i class="bi bi-x-lg"></i>
        </button>

      </div>

    }

    <!-- Add -->
    <button 
      type="button"
      class="btn btn-danger btn-sm px-2 py-1 mt-2"
      (click)="addSubCategory()"
    >
      <i class="bi bi-plus-lg"></i>
      Add SubCategory
    </button>

  </div>

  <!-- BUTTONS -->
  <div class="d-flex gap-2 mt-4">

    <button 
      type="button"
      class="btn-blue"
      (click)="submit()"
      [disabled]="!category.name.trim()"
    >
      {{ isEditMode ? 'Update Category' : 'Create Category' }}
    </button>

    <button 
      type="button"
      class="btn btn-warning"
      (click)="goBack()"
    >
      <i class="bi bi-arrow-left"></i> Back
    </button>

  </div>

</div>
