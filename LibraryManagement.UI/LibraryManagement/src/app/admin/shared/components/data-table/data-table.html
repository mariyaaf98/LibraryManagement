<div class="card">

  <table>

    <thead>
      <tr>
        @for (col of columns; track col) {
          <th>{{ col }}</th>
        }
      </tr>
    </thead>

    <tbody>

      @for (row of data; track row) {
        <tr>

          @for (col of columns; track col) {
            <td>{{ row[col] }}</td>
          }

        </tr>
      }

    </tbody>

  </table>

</div>
